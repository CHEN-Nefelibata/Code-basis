<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<!--table表示表格
    tr表示行
    td表示列  -->
    <table width="200px" height="200px" border="1px">
        <tr>
            <td>
                姓名
            </td>
            <td>
                年龄
            </td>
            <td>
                性别
            </td>
        </tr>
        <tr>
            <td>
                张三
            </td>
            <td>
                18
            </td>
            <td>
                男
            </td>
        </tr>
    </table>
<!-- ul li  无序列表,爬虫使用场景非常多 -->
    <ul>
        <li>铁锅炖大鹅</li>
        <li>小鸡炖蘑菇</li>
        <li>锅包肉</li>
    </ul>
<!-- ol li  有序列表 -->
    <ol>
        <li>穿衣</li>
        <li>下床</li>
        <li>洗漱</li>
    </ol>
<!-- a  超链接 -->
    <a href="http://www.bilibili.com">B站</a>
</body>
</html>
